events {}
http {
  server {
    listen 80;
    server_name _;

    location /ngsi-ld/ {
        proxy_pass http://orion:1026/ngsi-ld/;
    }
    location /filestorage/ {
            proxy_pass http://filestorage:4000/;
    }
    location / {
       proxy_pass http://fiware-grafana:3000/;
    }
  }
}